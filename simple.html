    <script>        
    
// From: https://jsfiddle.net/ditman/8Ffrw/

/**
 * The stars in our starfield!
 * Stars coordinate system is relative to the CENTER of the canvas
 * @param  {number} x 
 * @param  {number} y
 */
 var Star = function(x, y, maxSpeed) {
    this.x = x;
    this.y = y;
    this.slope = y / x; // This only works because our origin is always (0,0)
    this.opacity = 0;
    this.speed = Math.max(Math.random() * maxSpeed, 1);
};

/**
 * Compute the distance of this star relative to any other point in space.
 * 
 * @param  {int} originX
 * @param  {int} originY
 * 
 * @return {float} The distance of this star to the given origin
 */
Star.prototype.distanceTo = function(originX, originY) {
    return Math.sqrt(Math.pow(originX - this.x, 2) + Math.pow(originY - this.y, 2));
};

/**
 * Reinitializes this star's attributes, without re-creating it 
 * 
 * @param  {number} x 
 * @param  {number} y
 * 
 * @return {Star} this star
 */
Star.prototype.resetPosition = function(x, y, maxSpeed) {
    Star.apply(this, arguments);
    return this;
};

/**
 * The BigBang factory creates stars (Should be called StarFactory, but that is
 * a WAY LESS COOL NAME! 
 * @type {Object}
 */
var BigBang = {
    /**
     * Returns a random star within a region of the space.
     * 
     * @param  {number} minX minimum X coordinate of the region
     * @param  {number} minY minimum Y coordinate of the region
     * @param  {number} maxX maximum X coordinate of the region
     * @param  {number} maxY maximum Y coordinate of the region
     * 
     * @return {Star} The random star
     */
    getRandomStar: function(minX, minY, maxX, maxY, maxSpeed) {
        var coords = BigBang.getRandomPosition(minX, minY, maxX, maxY);
        return new Star(coords.x, coords.y, maxSpeed);
    },

    /**
     * Gets a random (x,y) position within a bounding box
     * 
     * 
     * @param  {number} minX minimum X coordinate of the region
     * @param  {number} minY minimum Y coordinate of the region
     * @param  {number} maxX maximum X coordinate of the region
     * @param  {number} maxY maximum Y coordinate of the region
     * 
     * @return {Object} An object with random {x, y} positions
     */
    getRandomPosition: function(minX, minY, maxX, maxY) {
        return {
            x: Math.floor((Math.random() * maxX) + minX),
            y: Math.floor((Math.random() * maxY) + minY)
        };
    }
};

/**
 * Constructor function of our starfield. This just prepares the DOM nodes where
 * the scene will be rendered.
 * 
 * @param {string} canvasId The DOM Id of the <div> containing a <canvas> tag
 */
var StarField = function(containerId) {
    this.container = document.getElementById(containerId);
    this.canvasElem = this.container.getElementsByTagName('canvas')[0];
    this.canvas = this.canvasElem.getContext('2d');

    this.width = this.container.offsetWidth;
    this.height = this.container.offsetHeight;

    this.starField = [];
};

/**
 * Updates the properties for every star for the next frame to be rendered
 */
StarField.prototype._updateStarField = function() {
    var i, 
        star, 
        randomLoc, 
        increment;

    for (i = 0; i < this.numStars; i++) {
        star = this.starField[i];
        
        increment = Math.min(star.speed, Math.abs(star.speed / star.slope));
        star.x += (star.x > 0) ? increment : -increment;
        star.y = star.slope * star.x;
        
        star.opacity += star.speed / 100;
        
        // Recycle star obj if it goes out of the frame
        if ((Math.abs(star.x) > this.width / 2) || 
            (Math.abs(star.y) > this.height / 2)) {
            //randomLoc = BigBang.getRandomPosition(
            //    -this.width / 2, -this.height / 2, 
            //       this.width, this.height
            //);
            randomLoc = BigBang.getRandomPosition(
                -this.width / 10, -this.height / 10, 
                   this.width / 5, this.height / 5
            );
            star.resetPosition(randomLoc.x, randomLoc.y, this.maxStarSpeed);
        }
    }
};

/**
 * Renders the whole starfield (background + stars)
 * This method could be made more efficient by just blipping each star,
 * and not redrawing the whole frame
 */
StarField.prototype._renderStarField = function() {
    var i,
        star;
    // Background
    this.canvas.fillStyle = "rgba(0, 0, 0, .5)";
    this.canvas.fillRect(0, 0, this.width, this.height);
    // Stars
    for (i = 0; i < this.numStars; i++) {
        star = this.starField[i];
        this.canvas.fillStyle = "rgba(128, 128, 128, " + star.opacity + ")";
        this.canvas.fillRect(
            star.x + this.width / 2, 
            star.y + this.height / 2, 
            2, 2);
    }
};

/**
 * Function that handles the animation of each frame. Update the starfield
 * positions and re-render
 */
StarField.prototype._renderFrame = function(elapsedTime) {
    var timeSinceLastFrame = elapsedTime - (this.prevFrameTime || 0);
    
    window.requestAnimationFrame(this._renderFrame.bind(this));

    // Skip frames unless at least 30ms have passed since the last one
    // (Cap to ~30fps)
    if (timeSinceLastFrame >= 30 || !this.prevFrameTime) {
        this.prevFrameTime = elapsedTime;
        this._updateStarField();
        this._renderStarField();
    }
};

/**
 * Makes sure that the canvas size fits the size of its container
 */
StarField.prototype._adjustCanvasSize = function(width, height) {
    // Set the canvas size to match the container ID (and cache values)
    this.width = this.canvasElem.width = width || this.container.offsetWidth;
    this.height = this.canvasElem.height = height || this.container.offsetHeight;
};

/**
 * This listener compares the old container size with the new one, and caches
 * the new values.
 */
StarField.prototype._watchCanvasSize = function(elapsedTime) {
    var timeSinceLastCheck = elapsedTime - (this.prevCheckTime || 0),
        width,
        height;

    window.requestAnimationFrame(this._watchCanvasSize.bind(this));

    // Skip frames unless at least 333ms have passed since the last check
    // (Cap to ~3fps)
    if (timeSinceLastCheck >= 333 || !this.prevCheckTime) {
        this.prevCheckTime = elapsedTime;
        width = this.container.offsetWidth;
        height = this.container.offsetHeight;
        if (this.oldWidth !== width || this.oldHeight !== height) {
            this.oldWidth = width;
            this.oldHeight = height;
            this._adjustCanvasSize(width, height);
        }
    }
};

/**
 * Initializes the scene by resizing the canvas to the appropiate value, and
 * sets up the main loop.
 * @param {int} numStars Number of stars in our starfield
 */
StarField.prototype._initScene = function(numStars) {
    var i;
    for (i = 0; i < this.numStars; i++) {
        this.starField.push(
            BigBang.getRandomStar(-this.width / 2, -this.height / 2, this.width, this.height, this.maxStarSpeed)
        );
    }

    // Intervals not stored because I don't plan to detach them later...
    window.requestAnimationFrame(this._renderFrame.bind(this));
    window.requestAnimationFrame(this._watchCanvasSize.bind(this));
};

/**
 * Kicks off everything!
 * @param {int} numStars The number of stars to render
 * @param {int} maxStarSpeed Maximum speed of the stars (pixels / frame)
 */
StarField.prototype.render = function(numStars, maxStarSpeed) {
    this.numStars = numStars || 100;
    this.maxStarSpeed = maxStarSpeed || 3;

    this._initScene(this.numStars);
};

/**
 * requestAnimationFrame shim layer with setTimeout fallback
 * @see http://paulirish.com/2011/requestanimationframe-for-smart-animating
 */
(function() {
    var lastTime = 0;
    var vendors = ['ms', 'moz', 'webkit', 'o'];
    for(var x = 0; x < vendors.length && !window.requestAnimationFrame; ++x) {
        window.requestAnimationFrame = window[vendors[x]+'RequestAnimationFrame'];
        window.cancelAnimationFrame = 
          window[vendors[x]+'CancelAnimationFrame'] || window[vendors[x]+'CancelRequestAnimationFrame'];
    }
 
    if (!window.requestAnimationFrame)
        window.requestAnimationFrame = function(callback, element) {
            var currTime = new Date().getTime();
            var timeToCall = Math.max(0, 16 - (currTime - lastTime));
            var id = window.setTimeout(function() { callback(currTime + timeToCall); }, 
              timeToCall);
            lastTime = currTime + timeToCall;
            return id;
        };
 
    if (!window.cancelAnimationFrame)
        window.cancelAnimationFrame = function(id) {
            clearTimeout(id);
        };
}());

// Kick off!
var starField = new StarField('fullScreen').render(333, 3);

        const GAME_TIMEOUT = 1000

        const klass_map = {
            "Iron Ore": "resource-E6",
            "Gold Ore": "resource-A1",
            "Diamond": "resource-E3",
            "Ulerite": "resource-F1",
            "Redball": "resource-A2",
            "Sunstone": "resource-E4",

            "Iron Bar": "resource-F5",
            "Iron Plate": "resource-B5",
            "Gold Bar": "resource-F6",
            "Wire": "resource-D2",

        }

        class CraftingRecipe {
            constructor(key, name, ingredients, resulting_quantity) {
                this.key = key;
                this.name = name;
                this.ingredients = ingredients;
                this.resulting_quantity = resulting_quantity;
            }
        }

        class ObjectWithQuantity {
            constructor(name, quantity) {
                this.quantity = quantity;
                this.name = name;
            }
        }

        const recipes = {
            "Iron Bar": new CraftingRecipe("iron_bar", "Iron Bar", [new ObjectWithQuantity("Iron Ore", 2)], 1),
            "Iron Plate": new CraftingRecipe("iron_plate", "Iron Plate", [new ObjectWithQuantity("Iron Ore", 1)], 1),
            "Gold Bar": new CraftingRecipe("gold_bar", "Gold Bar", [new ObjectWithQuantity("Gold Ore", 2)], 1),
            "Wire": new CraftingRecipe("wire", "Wire", [new ObjectWithQuantity("Redball", 1)], 2),
        }


        class InventoryItem {
            constructor(name) {
                this.name = name;
                this.id = generateUniqueId();
                this.markedForRemoval = false;
            }
        }

        const generateUniqueId = () => {
            return Math.random().toString(36).substr(2, 9);
        }

        class ObjectWithDuration {
            constructor(name, duration) {
                this.duration = duration;
                this.max_duration = duration;
                this.name = name;
            }

            progress() {
                return (this.max_duration - this.duration) / this.max_duration;
            }

            update() {
                this.duration--;
            }

            isAlive() {
                return this.duration > 0;
            }
        }

        class Game {
            constructor() {
                this.score = 0;
                this.time = 0;
                this.gameOver = false;
                this.paused = false;
                this.keys = {
                    enter: false,
                    escape: false,
                    leftArrow: false,
                    rightArrow: false,
                    upArrow: false,
                    downArrow: false,
                    p: false
                };
                this.objects = [];
                this.inventory = [];
                this.inventoryMaxSize = 40;
                this.craftables = [];
            }

            inventoryWithQuantities() {
                var inventory = {};
                this.inventory.forEach(item => {
                    if (inventory[item.name]) {
                        inventory[item.name].quantity += 1;
                    } else {
                        inventory[item.name] = new ObjectWithQuantity(item.name, 1);
                    }
                });
                return inventory;
            }

            findUsableRecipes() {
                var iq = this.inventoryWithQuantities();
                var usable = [];
                Object.keys(recipes).forEach(recipe_name => {
                    var recipe = recipes[recipe_name];
                    if (this.canCraft(iq, recipe)) {
                        usable.push(recipe);
                    }
                });
                return usable;
            }

            canCraft(iq, recipe) {
                var canCraft = true;
                recipe.ingredients.forEach(ingredient => {
                    if (!iq[ingredient.name] || iq[ingredient.name].quantity < ingredient.quantity) {
                        canCraft = false;
                    }
                });
                return canCraft;
            }

            start() {
                this.gameOver = false;
                this.score = 0;
                this.time = 0;
                this.updateScore();
                this.updateTime();
                this.updateGameOver();
            }

            updateScore() {
                $("#score").text(this.score);
            }

            updateTime() {
                $("#time").text(this.time);
            }

            updateGameOver() {
                $("#gameOver").text(this.gameOver);
            }

            incrementScore() {
                this.score++;
                this.updateScore();
            }

            spawnObjects() {
                // 10% probability of spawning Iron Ore
                // duration (in time): 5 sesonds (50 ticks)
                if(Math.random() < 0.1) {
                    this.objects.push(new ObjectWithDuration("Iron Ore", 20));
                }
                if(Math.random() < 0.03) {
                    this.objects.push(new ObjectWithDuration("Gold Ore", 15));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Diamond", 10));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Ulerite", 10));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Redball", 10));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Sunstone", 10));
                }
            }

            updatePlayer() {
                // the player has 1/32 chance of grabbing object in its vicinity...
                var grabbed = [];
                var remaining = [];
                this.objects.forEach(obj => {
                    if (Math.random() < (1.0/32)) {
                        grabbed.push(obj.name);
                    } else {
                        remaining.push(obj);
                    }
                });
                this.objects = remaining;
                var i = 0;
                while(this.inventory.length < this.inventoryMaxSize && i < grabbed.length) {
                    this.inventory.push(new InventoryItem(grabbed[i]));
                    i += 1;
                }
                if (i < grabbed.length) {
                    console.log("Inventory full!");
                }

                // update inventory
                this.inventory = this.inventory.filter(item => !item.markedForRemoval);
                var activeInventoryIds = this.inventory.map(item => item.id);
                $("#inventory").children().each((index, elem) => {
                    var id = elem.id.split("-")[1];
                    if (!activeInventoryIds.includes(id)) {
                        $(elem).remove();
                    }
                });
                this.inventory.forEach(item => {
                    var elem = $(`#inventory-${item.id}`);
                    if(elem.length == 0) {
                        elem = $(`<div class="inventory-item" title="${item.name}" id="inventory-${item.id}"><div class="${klass_map[item.name]}"></div></div>`);
                        $("#inventory").append(elem);
                        elem.click(() => {
                            console.log("clicked on", item.name, item.id);
                            for(var i=0; i<this.inventory.length; i++) {
                                if (this.inventory[i].id === item.id) {
                                    this.inventory[i].markedForRemoval = true;
                                    break;
                                }
                            }
                        });
                    }
                });

                // update crafting recipes
                var craftables = this.findUsableRecipes();
                console.log("Craftables:", craftables);
                var activeCraftingIds = craftables.map(item => item.key);
                $("#crafting").children().each((index, elem) => {
                    var id = elem.id.split("-")[1];
                    if (!activeCraftingIds.includes(id)) {
                        $(elem).remove();
                    }
                });
                craftables.forEach(recipe => {
                    var elem = $(`#crafting-${recipe.key}`);
                    if(elem.length == 0) {
                        elem = $(`<div class="crafting-item" title="${recipe.name}" id="crafting-${recipe.key}"><div class="${klass_map[recipe.name]}"></div><span>${recipe.resulting_quantity}</span></div>`);
                        elem.click(() => {
                            console.log("clicked on", recipe.name, recipe.key);
                            this.craft(recipe);
                        })
                        $("#crafting").append(elem);
                        this.craftables.push(recipe);
                    }
                });
            }

            craft(recipe) {
                //alert("crafting! " + recipe.key);
                var ingr = recipe.ingredients;
                var iq = this.inventoryWithQuantities();
                if(!this.canCraft(iq, recipe)) {
                    alert("Cannot craft " + recipe.name);
                    return;
                }
                // remove ingredients...
                ingr.forEach(ingredient => {
                    for(var i=0; i<ingredient.quantity; i++) {
                        for(var j=0; j<this.inventory.length; j++) {
                            if (this.inventory[j].name === ingredient.name && !this.inventory[j].markedForRemoval) {
                                this.inventory[j].markedForRemoval = true;
                            }
                        }
                    }
                });
                // add result...
                for(var i=0; i<recipe.resulting_quantity; i++) {
                    this.inventory.push(new InventoryItem(recipe.name));
                }
                
            }

            updateObjects() {
                var objs = [];
                this.objects.forEach(obj => {
                    obj.update();
                    if (obj.isAlive()) {
                        objs.push(obj);
                    }
                });
                this.objects = objs;
                this.spawnObjects();

                // update display of objects
                $("#objects").empty();
                this.objects.forEach(item => {
                    $("#objects").append(`<div class="incoming-item" title="${item.name}" style="opacity: ${1.0-item.progress()};"><div class="${klass_map[item.name]}"></div></div>`);
                });

            }

            incrementTime() {
                this.time++;
                this.updateTime();
            }

            endGame() {
                this.gameOver = true;
                this.updateGameOver();
            }
        }

        function runGameLoop(game) {
            if (game.keys.p) {
                // Handle Enter key
                this.paused = !this.paused;
            }
            if(this.paused) {
                // skip...
                setTimeout(() => runGameLoop(game), 100);
                return;
            }
            console.log("Time: " + game.time, 'Objects:', game.objects.length);
            game.updatePlayer();
            game.updateObjects();
            game.incrementTime();
            game.updateTime();

            // Check key states
            if (game.keys.enter) {
                // Handle Enter key
                console.log("Enter");
            }
            if (game.keys.escape) {
                return;
            }
            if (game.keys.leftArrow) {
                // Handle left arrow key
            }
            if (game.keys.rightArrow) {
                // Handle right arrow key
            }
            if (game.keys.upArrow) {
                // Handle up arrow key
            }
            if (game.keys.downArrow) {
                // Handle down arrow key
            }            
            if (game.time > GAME_TIMEOUT) {
                game.endGame();
            }

            if (!game.gameOver) {
                //requestAnimationFrame(() => runGameLoop(game)); // Use requestAnimationFrame for smoother animation
                setTimeout(() => runGameLoop(game), 100);
            } else {
                console.log("Game over");
            }
        }        

        function handleKeyDown(event, game) {
            console.log("key down:", event.key)
            if (event.key === "Enter") {
                game.keys.enter = true;
            } else if (event.key === "p") {
                game.keys.p = true;
            } else if (event.key === "Escape") {
                game.keys.escape = true;
            } else if (event.key === "ArrowLeft") {
                game.keys.leftArrow = true;
            } else if (event.key === "ArrowRight") {
                game.keys.rightArrow = true;
            } else if (event.key === "ArrowUp") {
                game.keys.upArrow = true;
            } else if (event.key === "ArrowDown") {
                game.keys.downArrow = true;
            }
        }

        function handleKeyUp(event, game) {
            if (event.key === "Enter") {
                game.keys.enter = false;
            } else if (event.key === "p") {
                game.keys.p = false;
            } else if (event.key === "Escape") {
                game.keys.escape = false;
            } else if (event.key === "ArrowLeft") {
                game.keys.leftArrow = false;
            } else if (event.key === "ArrowRight") {
                game.keys.rightArrow = false;
            } else if (event.key === "ArrowUp") {
                game.keys.upArrow = false;
            } else if (event.key === "ArrowDown") {
                game.keys.downArrow = false;
            }
        }

        $(document).ready(function(){
            // jQuery code can be placed here
            $("#changeColorButton").click(function(){
                $("h1").css("color", "blue");
            });

            console.log("hello!");

            // your game here...
            const game = new Game();
            console.log('Game created!', game)

            // Add event listeners for keydown and keyup
            document.addEventListener("keydown", (event) => handleKeyDown(event, game));
            document.addEventListener("keyup", (event) => handleKeyUp(event, game));

            // Start the game loop
            runGameLoop(game);
        });
    </script>
</body>
</html>
