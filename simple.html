<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Miner</title>
    <link rel="stylesheet" type="text/css" href="media/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Asteroid Miner</h1>

    <div id="game">

        <h2>Incoming Objects</h2>
        <div id="objects">
            </div>
        <h2>Inventory</h2>
        <div id="inventory">

        </div>

        <h2>Crafting</h2>
        <div id="crafting">

        </div>

    </div>
        
    <script>        

        const GAME_TIMEOUT = 1000

        const klass_map = {
            "Iron Ore": "resource-E6",
            "Gold Ore": "resource-A1",
            "Diamond": "resource-E3",
            "Ulerite": "resource-F1",
            "Redball": "resource-A2",
            "Sunstone": "resource-E4",

            "Iron Bar": "resource-F5",
            "Iron Plate": "resource-B5",
            "Gold Bar": "resource-F6",
            "Wire": "resource-D2",

        }

        class CraftingRecipe {
            constructor(name, ingredients, resulting_quantity) {
                this.name = name;
                this.ingredients = ingredients;
                this.resulting_quantity = resulting_quantity;
            }
        }

        class ObjectWithQuantity {
            constructor(name, quantity) {
                this.quantity = quantity;
                this.name = name;
            }
        }

        const recipes = {
            "Iron Bar": new CraftingRecipe("Iron Bar", [new ObjectWithQuantity("Iron Ore", 2)], 1),
            "Iron Plate": new CraftingRecipe("Iron Plate", [new ObjectWithQuantity("Iron Ore", 1)], 1),
            "Gold Bar": new CraftingRecipe("Gold Bar", [new ObjectWithQuantity("Gold Ore", 2)], 1),
            "Wire": new CraftingRecipe("Wire", [new ObjectWithQuantity("Redball", 1)], 2),
        }


        class ObjectWithDuration {
            constructor(name, duration) {
                this.duration = duration;
                this.max_duration = duration;
                this.name = name;
            }

            progress() {
                return (this.max_duration - this.duration) / this.max_duration;
            }

            update() {
                this.duration--;
            }

            isAlive() {
                return this.duration > 0;
            }
        }

        class Game {
            constructor() {
                this.score = 0;
                this.time = 0;
                this.gameOver = false;
                this.paused = false;
                this.keys = {
                    enter: false,
                    escape: false,
                    leftArrow: false,
                    rightArrow: false,
                    upArrow: false,
                    downArrow: false,
                    p: false
                };
                this.objects = [];
                this.inventory = [];
                this.inventoryMaxSize = 35;
            }

            inventoryWithQuantities() {
                var inventory = {};
                this.inventory.forEach(item => {
                    if (inventory[item]) {
                        inventory[item].quantity += 1;
                    } else {
                        inventory[item] = new ObjectWithQuantity(item, 1);
                    }
                });
                return inventory;
            }

            findUsableRecipes() {
                var iq = this.inventoryWithQuantities();
                var usable = [];
                Object.keys(recipes).forEach(recipe_name => {
                    var recipe = recipes[recipe_name];
                    if (this.canCraft(iq, recipe)) {
                        usable.push(recipe);
                    }
                });
                return usable;
            }

            canCraft(iq, recipe) {
                var canCraft = true;
                recipe.ingredients.forEach(ingredient => {
                    if (!iq[ingredient.name] || iq[ingredient.name].quantity < ingredient.quantity) {
                        canCraft = false;
                    }
                });
                return canCraft;
            }

            start() {
                this.gameOver = false;
                this.score = 0;
                this.time = 0;
                this.updateScore();
                this.updateTime();
                this.updateGameOver();
            }

            updateScore() {
                $("#score").text(this.score);
            }

            updateTime() {
                $("#time").text(this.time);
            }

            updateGameOver() {
                $("#gameOver").text(this.gameOver);
            }

            incrementScore() {
                this.score++;
                this.updateScore();
            }

            spawnObjects() {
                // 10% probability of spawning Iron Ore
                // duration (in time): 5 sesonds (50 ticks)
                if(Math.random() < 0.1) {
                    this.objects.push(new ObjectWithDuration("Iron Ore", 20));
                }
                if(Math.random() < 0.03) {
                    this.objects.push(new ObjectWithDuration("Gold Ore", 15));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Diamond", 10));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Ulerite", 10));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Redball", 10));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Sunstone", 10));
                }
            }

            updatePlayer() {
                // the player has 1/32 chance of grabbing object in its vicinity...
                var grabbed = [];
                var remaining = [];
                this.objects.forEach(obj => {
                    if (Math.random() < (1.0/32)) {
                        grabbed.push(obj.name);
                    } else {
                        remaining.push(obj);
                    }
                });
                this.objects = remaining;
                var i = 0;
                while(this.inventory.length < this.inventoryMaxSize && i < grabbed.length) {
                    this.inventory.push(grabbed[i]);
                    i += 1;
                }
                if (i < grabbed.length) {
                    console.log("Inventory full!");
                }

                // update inventory
                $("#inventory").empty();
                this.inventory.forEach(item => {
                    $("#inventory").append(`<div class="inventory-item" title="${item}"><div class="${klass_map[item]}"></div></div>`);
                });

                // update crafting recipes
                var craftables = this.findUsableRecipes();
                console.log("Craftables:", craftables);
                $("#crafting").empty();
                craftables.forEach(recipe => {
                    $("#crafting").append(`<div class="crafting-item" title="${recipe.name}"><div class="${klass_map[recipe.name]}"></div><span>${recipe.resulting_quantity}</span></div>`);
                });
            }

            updateObjects() {
                var objs = [];
                this.objects.forEach(obj => {
                    obj.update();
                    if (obj.isAlive()) {
                        objs.push(obj);
                    }
                });
                this.objects = objs;
                this.spawnObjects();

                // update display of objects
                $("#objects").empty();
                this.objects.forEach(item => {
                    $("#objects").append(`<div class="incoming-item" title="${item.name}" style="opacity: ${1.0-item.progress()};"><div class="${klass_map[item.name]}"></div></div>`);
                });

            }

            incrementTime() {
                this.time++;
                this.updateTime();
            }

            endGame() {
                this.gameOver = true;
                this.updateGameOver();
            }
        }

        function runGameLoop(game) {
            if (game.keys.p) {
                // Handle Enter key
                this.paused = !this.paused;
            }
            if(this.paused) {
                // skip...
                setTimeout(() => runGameLoop(game), 100);
                return;
            }
            console.log("Time: " + game.time, 'Objects:', game.objects.length);
            game.updatePlayer();
            game.updateObjects();
            game.incrementTime();
            game.updateTime();

            // Check key states
            if (game.keys.enter) {
                // Handle Enter key
                console.log("Enter");
            }
            if (game.keys.escape) {
                return;
            }
            if (game.keys.leftArrow) {
                // Handle left arrow key
            }
            if (game.keys.rightArrow) {
                // Handle right arrow key
            }
            if (game.keys.upArrow) {
                // Handle up arrow key
            }
            if (game.keys.downArrow) {
                // Handle down arrow key
            }            
            if (game.time > GAME_TIMEOUT) {
                game.endGame();
            }

            if (!game.gameOver) {
                //requestAnimationFrame(() => runGameLoop(game)); // Use requestAnimationFrame for smoother animation
                setTimeout(() => runGameLoop(game), 100);
            } else {
                console.log("Game over");
            }
        }        

        function handleKeyDown(event, game) {
            console.log("key down:", event.key)
            if (event.key === "Enter") {
                game.keys.enter = true;
            } else if (event.key === "p") {
                game.keys.p = true;
            } else if (event.key === "Escape") {
                game.keys.escape = true;
            } else if (event.key === "ArrowLeft") {
                game.keys.leftArrow = true;
            } else if (event.key === "ArrowRight") {
                game.keys.rightArrow = true;
            } else if (event.key === "ArrowUp") {
                game.keys.upArrow = true;
            } else if (event.key === "ArrowDown") {
                game.keys.downArrow = true;
            }
        }

        function handleKeyUp(event, game) {
            if (event.key === "Enter") {
                game.keys.enter = false;
            } else if (event.key === "p") {
                game.keys.p = false;
            } else if (event.key === "Escape") {
                game.keys.escape = false;
            } else if (event.key === "ArrowLeft") {
                game.keys.leftArrow = false;
            } else if (event.key === "ArrowRight") {
                game.keys.rightArrow = false;
            } else if (event.key === "ArrowUp") {
                game.keys.upArrow = false;
            } else if (event.key === "ArrowDown") {
                game.keys.downArrow = false;
            }
        }

        $(document).ready(function(){
            // jQuery code can be placed here
            $("#changeColorButton").click(function(){
                $("h1").css("color", "blue");
            });

            console.log("hello!");

            // your game here...
            const game = new Game();
            console.log('Game created!', game)

            // Add event listeners for keydown and keyup
            document.addEventListener("keydown", (event) => handleKeyDown(event, game));
            document.addEventListener("keyup", (event) => handleKeyUp(event, game));

            // Start the game loop
            runGameLoop(game);
        });
    </script>
</body>
</html>
