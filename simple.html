<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Miner</title>
    <link rel="stylesheet" type="text/css" href="media/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Asteroid Miner</h1>

    <!-- Your jQuery code can go here -->

    <!-- Example: Change text color on button click -->
    <button id="changeColorButton">Change Text Color</button>

    <div id="game">
        <div>
            <span><strong>Score:</strong></span>
            <span id="score">0</span>
        </div>
        <div>
            <span><strong>Time:</strong></span>
            <span id="time">0</span>
        </div>
        <div>
            <span><strong>Game Over:</strong></span>
            <span id="gameOver">false</span>
        </div>
        <h2>Incoming Objects</h2>
        <div id="objects">
            </div>
        <h2>Inventory</h2>
        <div id="inventory">

        </div>
    </div>
        
    <script>        

        const GAME_TIMEOUT = 1000

        const klass_map = {
            "Iron Ore": "resource-E6",
            "Gold Ore": "resource-A1",
            "Diamond": "resource-E3",
            "Ulerite": "resource-F1",
            "Redball": "resource-A2",
            "Sunstone": "resource-E4"
        }

        class ObjectWithDuration {
            constructor(name, duration) {
                this.duration = duration;
                this.max_duration = duration;
                this.name = name;
            }

            progress() {
                return (this.max_duration - this.duration) / this.max_duration;
            }

            update() {
                this.duration--;
            }

            isAlive() {
                return this.duration > 0;
            }
        }

        class Game {
            constructor() {
                this.score = 0;
                this.time = 0;
                this.gameOver = false;
                this.paused = false;
                this.keys = {
                    enter: false,
                    escape: false,
                    leftArrow: false,
                    rightArrow: false,
                    upArrow: false,
                    downArrow: false,
                    p: false
                };
                this.objects = [];
                this.inventory = [];
                this.inventoryMaxSize = 35;
            }

            start() {
                this.gameOver = false;
                this.score = 0;
                this.time = 0;
                this.updateScore();
                this.updateTime();
                this.updateGameOver();
            }

            updateScore() {
                $("#score").text(this.score);
            }

            updateTime() {
                $("#time").text(this.time);
            }

            updateGameOver() {
                $("#gameOver").text(this.gameOver);
            }

            incrementScore() {
                this.score++;
                this.updateScore();
            }

            spawnObjects() {
                // 10% probability of spawning Iron Ore
                // duration (in time): 5 sesonds (50 ticks)
                if(Math.random() < 0.1) {
                    this.objects.push(new ObjectWithDuration("Iron Ore", 20));
                }
                if(Math.random() < 0.03) {
                    this.objects.push(new ObjectWithDuration("Gold Ore", 15));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Diamond", 10));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Ulerite", 10));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Redball", 10));
                }
                if(Math.random() < 0.01) {
                    this.objects.push(new ObjectWithDuration("Sunstone", 10));
                }
            }

            updatePlayer() {
                // the player has 1/32 chance of grabbing object in its vicinity...
                var grabbed = [];
                var remaining = [];
                this.objects.forEach(obj => {
                    if (Math.random() < (1.0/32)) {
                        grabbed.push(obj.name);
                    } else {
                        remaining.push(obj);
                    }
                });
                this.objects = remaining;
                var i = 0;
                while(this.inventory.length < this.inventoryMaxSize && i < grabbed.length) {
                    this.inventory.push(grabbed[i]);
                    i += 1;
                }
                if (i < grabbed.length) {
                    console.log("Inventory full!");
                }

                // update inventory
                $("#inventory").empty();
                this.inventory.forEach(item => {
                    $("#inventory").append(`<div class="inventory-item"><div class="${klass_map[item]}"></div></div>`);
                });
            }

            updateObjects() {
                var objs = [];
                this.objects.forEach(obj => {
                    obj.update();
                    if (obj.isAlive()) {
                        objs.push(obj);
                    }
                });
                this.objects = objs;
                this.spawnObjects();

                // update display of objects
                $("#objects").empty();
                this.objects.forEach(item => {
                    $("#objects").append(`<div class="incoming-item" style="opacity: ${1.0-item.progress()};"><div class="${klass_map[item.name]}"></div></div>`);
                });
            }

            incrementTime() {
                this.time++;
                this.updateTime();
            }

            endGame() {
                this.gameOver = true;
                this.updateGameOver();
            }
        }

        function runGameLoop(game) {
            if (game.keys.p) {
                // Handle Enter key
                this.paused = !this.paused;
            }
            if(this.paused) {
                // skip...
                setTimeout(() => runGameLoop(game), 100);
                return;
            }
            console.log("Time: " + game.time, 'Objects:', game.objects.length);
            game.updatePlayer();
            game.updateObjects();
            game.incrementTime();
            game.updateTime();

            // Check key states
            if (game.keys.enter) {
                // Handle Enter key
                console.log("Enter");
            }
            if (game.keys.escape) {
                return;
            }
            if (game.keys.leftArrow) {
                // Handle left arrow key
            }
            if (game.keys.rightArrow) {
                // Handle right arrow key
            }
            if (game.keys.upArrow) {
                // Handle up arrow key
            }
            if (game.keys.downArrow) {
                // Handle down arrow key
            }            
            if (game.time > GAME_TIMEOUT) {
                game.endGame();
            }

            if (!game.gameOver) {
                //requestAnimationFrame(() => runGameLoop(game)); // Use requestAnimationFrame for smoother animation
                setTimeout(() => runGameLoop(game), 100);
            } else {
                console.log("Game over");
            }
        }        

        function handleKeyDown(event, game) {
            console.log("key down:", event.key)
            if (event.key === "Enter") {
                game.keys.enter = true;
            } else if (event.key === "p") {
                game.keys.p = true;
            } else if (event.key === "Escape") {
                game.keys.escape = true;
            } else if (event.key === "ArrowLeft") {
                game.keys.leftArrow = true;
            } else if (event.key === "ArrowRight") {
                game.keys.rightArrow = true;
            } else if (event.key === "ArrowUp") {
                game.keys.upArrow = true;
            } else if (event.key === "ArrowDown") {
                game.keys.downArrow = true;
            }
        }

        function handleKeyUp(event, game) {
            if (event.key === "Enter") {
                game.keys.enter = false;
            } else if (event.key === "p") {
                game.keys.p = false;
            } else if (event.key === "Escape") {
                game.keys.escape = false;
            } else if (event.key === "ArrowLeft") {
                game.keys.leftArrow = false;
            } else if (event.key === "ArrowRight") {
                game.keys.rightArrow = false;
            } else if (event.key === "ArrowUp") {
                game.keys.upArrow = false;
            } else if (event.key === "ArrowDown") {
                game.keys.downArrow = false;
            }
        }

        $(document).ready(function(){
            // jQuery code can be placed here
            $("#changeColorButton").click(function(){
                $("h1").css("color", "blue");
            });

            console.log("hello!");

            // your game here...
            const game = new Game();
            console.log('Game created!', game)

            // Add event listeners for keydown and keyup
            document.addEventListener("keydown", (event) => handleKeyDown(event, game));
            document.addEventListener("keyup", (event) => handleKeyUp(event, game));

            // Start the game loop
            runGameLoop(game);
        });
    </script>
</body>
</html>
